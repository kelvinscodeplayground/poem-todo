[package]
name = "poem-todo"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
log = "0.4.33"
poem = "3.1.12"
poem-openapi = { version = "5.1.16", features = ["swagger-ui"] }
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.1", features = ["v4", "v7"] }
